<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{back-end/admin/layout}">
<head>
    <title>操作失敗</title>
</head>
<body>

<h1 class="page-title" layout:fragment="pagetitle">操作失敗</h1>

<div layout:fragment="content">
    <div class="card" style="max-width: 560px;">
        <div class="card-body">
            <div class="alert alert-danger" th:text="${errorMessage}">操作失敗</div>
            <a class="btn btn-secondary" href="javascript:history.back()">回上一頁</a>
            <a class="btn btn-outline-secondary ml-2" th:href="@{/admin/dashboard}">回總覽</a>
        </div>
    </div>
</div>
</body>
</html>
