<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{back-end/admin/layout}">
<head>
    <title>小農管理</title>
</head>
<body>

<h1 class="page-title" layout:fragment="pagetitle">小農管理</h1>

<div layout:fragment="content">

    <!-- 複合查詢：關鍵字（農場名稱 / Email / 電話）、小農狀態 -->
    <form method="get" th:action="@{/admin/farmers}" class="form-inline mb-2">
        <input type="text" name="kw" th:value="${kw}" class="form-control form-control-sm mr-2 mb-1"
               placeholder="農場名稱 / Email / 電話"/>
        <select name="status" class="form-control form-control-sm mr-2 mb-1">
            <option value="" th:selected="${status == null or status == ''}">全部狀態</option>
            <option value="ACTIVE"    th:selected="${status == 'ACTIVE'}">啟用中</option>
            <option value="PENDING"   th:selected="${status == 'PENDING'}">待啟用</option>
            <option value="SUSPENDED" th:selected="${status == 'SUSPENDED'}">已停權</option>
        </select>
        <button type="submit" class="btn btn-sm btn-primary mr-1 mb-1">查詢</button>
        <a th:href="@{/admin/farmers}" class="btn btn-sm btn-outline-secondary mb-1">清除</a>
    </form>

    <div class="table-card">
        <table id="farmerTable" class="table table-striped table-bordered" style="width:100%">
            <thead class="thead-light">
            <tr>
                <th>編號</th><th>Email</th><th>農場名稱</th><th>電話</th>
                <th>縣市</th><th>區</th><th>小農狀態</th><th>審核狀態</th><th>操作</th><th>詳情</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="farmer : ${farmers.content}">
                <td th:text="${farmer.farmerId}"></td>
                <td th:text="${farmer.email}"></td>
                <td th:text="${farmer.farmName}"></td>
                <td th:text="${farmer.farmerPhoneNum}"></td>
                <td th:text="${farmer.cityName}"></td>
                <td th:text="${farmer.distName}"></td>
                <td>
                    <span class="badge-status"
                          th:classappend="${farmer.farmerStatus == 'ACTIVE'} ? 'st-active'
                                        : (${farmer.farmerStatus == 'PENDING'} ? 'st-pending' : 'st-suspended')"
                          th:text="${farmer.farmerStatus}"></span>
                </td>
                <td th:text="${farmer.reviewStatus}"></td>
                <td>
                    <!-- ACTIVE 才能停權 -->
                    <form th:if="${farmer.farmerStatus == 'ACTIVE'}" method="post" class="d-inline"
                          th:action="@{/admin/farmers/{id}/suspend(id=${farmer.farmerId})}">
                        <button class="btn btn-sm btn-outline-danger">停權</button>
                    </form>
                    <!-- SUSPENDED 才能恢復 -->
                    <form th:if="${farmer.farmerStatus == 'SUSPENDED'}" method="post" class="d-inline"
                          th:action="@{/admin/farmers/{id}/reinstate(id=${farmer.farmerId})}">
                        <button class="btn btn-sm btn-outline-success">恢復</button>
                    </form>
                    <span th:if="${farmer.farmerStatus == 'PENDING'}" class="text-muted">尚未啟用</span>
                </td>
                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/admin/farmers/{id}(id=${farmer.farmerId})}">詳情</a>
                </td>
            </tr>
            <tr th:if="${farmers.empty}">
                <td colspan="10" class="text-center text-muted">沒有符合條件的小農</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 分頁列：上一頁 / 下一頁，沿用目前查詢條件 -->
    <div class="d-flex align-items-center mt-2" th:if="${farmers.totalPages > 0}">
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${farmers.first} ? 'disabled'"
           th:href="@{/admin/farmers(kw=${kw}, status=${status}, page=${farmers.number - 1})}">上一頁</a>
        <span class="mx-2 text-muted">
            第 <span th:text="${farmers.number + 1}"></span> / <span th:text="${farmers.totalPages}"></span> 頁
            （共 <span th:text="${farmers.totalElements}"></span> 筆）
        </span>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${farmers.last} ? 'disabled'"
           th:href="@{/admin/farmers(kw=${kw}, status=${status}, page=${farmers.number + 1})}">下一頁</a>
    </div>
</div>
</body>
</html>
