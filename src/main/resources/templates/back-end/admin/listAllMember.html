<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{back-end/admin/layout}">
<head>
    <title>會員管理</title>
</head>
<body>

<h1 class="page-title" layout:fragment="pagetitle">會員管理</h1>

<div layout:fragment="content">

    <!-- 複合查詢：關鍵字（Email / 姓名 / 電話）、會員狀態 -->
    <form method="get" th:action="@{/admin/members}" class="form-inline mb-2">
        <input type="text" name="kw" th:value="${kw}" class="form-control form-control-sm mr-2 mb-1"
               placeholder="Email / 姓名 / 電話"/>
        <select name="status" class="form-control form-control-sm mr-2 mb-1">
            <option value="" th:selected="${status == null or status == ''}">全部狀態</option>
            <option value="ACTIVE"    th:selected="${status == 'ACTIVE'}">正常</option>
            <option value="WARNED"    th:selected="${status == 'WARNED'}">警告</option>
            <option value="SUSPENDED" th:selected="${status == 'SUSPENDED'}">停權</option>
        </select>
        <button type="submit" class="btn btn-sm btn-primary mr-1 mb-1">查詢</button>
        <a th:href="@{/admin/members}" class="btn btn-sm btn-outline-secondary mb-1">清除</a>
    </form>

    <div class="table-card">
        <table id="memberTable" class="table table-striped table-bordered" style="width:100%">
            <thead class="thead-light">
            <tr>
                <th>編號</th>
                <th>Email</th>
                <th>姓名</th>
                <th>暱稱</th>
                <th>電話</th>
                <th>縣市</th>
                <th>區</th>
                <th>消費級距</th>
                <th>Email驗證</th>
                <th>狀態</th>
                <th>變更狀態</th>
                <th>詳情</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${members.content}">
                <td th:text="${member.userId}"></td>
                <td th:text="${member.email}"></td>
                <td th:text="${member.userName}"></td>
                <td th:text="${member.userNickname}"></td>
                <td th:text="${member.userPhoneNum}"></td>
                <td th:text="${member.cityName}"></td>
                <td th:text="${member.distName}"></td>
                <td th:text="${member.spendingTier}"></td>
                <td>
                    <span class="badge-status" th:classappend="${member.emailVerified} ? 'st-active' : 'st-neutral'"
                          th:text="${member.emailVerified} ? '是' : '否'"></span>
                </td>
                <td>
                    <span class="badge-status"
                          th:classappend="${member.userStatus.name() == 'ACTIVE'} ? 'st-active'
                                        : (${member.userStatus.name() == 'WARNED'} ? 'st-warned' : 'st-suspended')"
                          th:text="${member.userStatus}"></span>
                </td>
                <td>
                    <!-- 每列一個小表單；th:action 會自動帶 CSRF 隱藏欄位 -->
                    <form method="post"
                          th:action="@{/admin/members/{id}/status(id=${member.userId})}"
                          class="form-inline">
                        <select name="status" class="form-control form-control-sm mr-1">
                            <option value="ACTIVE"    th:selected="${member.userStatus.name() == 'ACTIVE'}">正常</option>
                            <option value="WARNED"    th:selected="${member.userStatus.name() == 'WARNED'}">警告</option>
                            <option value="SUSPENDED" th:selected="${member.userStatus.name() == 'SUSPENDED'}">停權</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-outline-primary">更新</button>
                    </form>
                </td>
                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/admin/members/{id}(id=${member.userId})}">詳情</a>
                </td>
            </tr>
            <tr th:if="${members.empty}">
                <td colspan="12" class="text-center text-muted">沒有符合條件的會員</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 分頁列：上一頁 / 下一頁，沿用目前查詢條件 -->
    <div class="d-flex align-items-center mt-2" th:if="${members.totalPages > 0}">
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${members.first} ? 'disabled'"
           th:href="@{/admin/members(kw=${kw}, status=${status}, page=${members.number - 1})}">上一頁</a>
        <span class="mx-2 text-muted">
            第 <span th:text="${members.number + 1}"></span> / <span th:text="${members.totalPages}"></span> 頁
            （共 <span th:text="${members.totalElements}"></span> 筆）
        </span>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${members.last} ? 'disabled'"
           th:href="@{/admin/members(kw=${kw}, status=${status}, page=${members.number + 1})}">下一頁</a>
    </div>
</div>
</body>
</html>
