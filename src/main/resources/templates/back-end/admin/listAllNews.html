<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>最新消息管理</title>
  <th:block th:insert="~{back-end/admin/included-fragment}"></th:block>
</head>
<body>
<nav class="navbar navbar-dark bg-success">
  <a class="navbar-brand" th:href="@{/admin/dashboard}">← 回總覽</a>
  <span class="navbar-text text-white">
    最新消息管理
    <span th:text="${success}"></span>
    <span class="text-warning ml-2" th:text="${error}"></span>
</span>
</nav>

<div class="container mt-3">
  <div class="card mb-4">
    <div class="card-header">新增最新消息</div>
    <div class="card-body">
      <form method="post" th:action="@{/admin/news}" enctype="multipart/form-data">
        <div class="form-group">
          <label>標題</label>
          <input type="text" name="title" class="form-control" required>
        </div>

        <div class="form-group">
          <label>內容</label>
          <textarea name="content" class="form-control" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label>發布時間</label>
          <input type="datetime-local" name="publishTime" class="form-control">
                 placeholder="例如：2024-06-05 09:00:00">
        </div>

        <div class="form-group">
          <label>封面圖片</label>
          <input type="file" name="coverImg" class="form-control-file" accept="image/*">
        </div>

        <button type="submit" class="btn btn-success">新增</button>
      </form>
    </div>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
    <tr>
      <th>編號</th>
      <th>封面</th>
      <th>標題</th>
      <th>內容</th>
      <th>發布時間</th>
      <th>狀態</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="news : ${newsListData}">
      <td th:text="${news.newsId}"></td>
      <td>
        <img th:src="@{/api/news/{id}/image(id=${news.newsId})}"
             style="width:100px;height:70px;object-fit:cover;"
             onerror="this.style.display='none'">
      </td>
      <td th:text="${news.title}"></td>
      <td th:text="${news.content}"></td>
      <td th:text="${news.publishTime}"></td>
      <td th:text="${news.newsStatus}"></td>
      <td>
        <form method="post" class="d-inline"
              th:action="@{/admin/news/{id}/status(id=${news.newsId})}">
          <input type="hidden" name="publish" value="true">
          <button type="submit" class="btn btn-sm btn-outline-success">上架</button>
        </form>

        <form method="post" class="d-inline"
              th:action="@{/admin/news/{id}/status(id=${news.newsId})}">
          <input type="hidden" name="publish" value="false">
          <button type="submit" class="btn btn-sm btn-outline-secondary">下架</button>
        </form>

        <form method="post" class="d-inline"
              th:action="@{/admin/news/{id}/delete(id=${news.newsId})}"
              onsubmit="return confirm('確定刪除這筆最新消息？');">
          <button type="submit" class="btn btn-sm btn-outline-danger">刪除</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
