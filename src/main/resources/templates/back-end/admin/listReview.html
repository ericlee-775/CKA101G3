<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{back-end/admin/layout}">
<head>
    <title>小農審核</title>
    <style>
        /* 審核中案件收合起來，點 summary 展開才看得到內容 */
        details.review-item > summary { cursor: pointer; list-style: none; }
        details.review-item > summary::-webkit-details-marker { display: none; }
        details.review-item[open] > summary { border-bottom: 1px solid #eee; }
        /* 退件鈕本身是 summary，去掉預設三角，外觀維持按鈕樣式 */
        .reject-box > summary { list-style: none; }
        .reject-box > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body>

<h1 class="page-title" layout:fragment="pagetitle">小農審核</h1>

<div layout:fragment="content">

    <!-- ===== 待審清單 ===== -->
    <div class="section-title"><span class="bar"></span>待審核（PENDING）</div>
    <div class="table-card mb-4">
        <table class="table table-bordered mb-0">
            <thead class="thead-light">
            <tr><th>審核編號</th><th>農場名稱</th><th>Email</th><th>輪次</th><th>送審時間</th><th>操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${pendingData}">
                <td th:text="${r.reviewId}"></td>
                <td th:text="${r.farmName}"></td>
                <td th:text="${r.farmerEmail}"></td>
                <td th:text="${r.reviewRound}"></td>
                <td th:text="${r.submittedAt != null ? #temporals.format(r.submittedAt,'yyyy-MM-dd HH:mm') : '—'}"></td>
                <td>
                    <form method="post" th:action="@{/admin/reviews/{id}/start(id=${r.reviewId})}"
                          onsubmit="return confirm('確定認領此審核案件？認領後將由您負責後續審核。');">
                        <button class="btn btn-sm btn-primary">認領審核</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pendingData.isEmpty()}"><td colspan="6" class="text-center text-muted">目前沒有待審案件</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ===== 審核中清單 ===== -->
    <div class="section-title"><span class="bar"></span>審核中（REVIEWING）</div>

    <!-- 每個案件收合起來，點開才看得到內容；文件與審核操作僅限負責（認領）此案件的管理員 -->
    <details th:each="r : ${reviewingData}" class="card mb-3 review-item">
        <summary class="card-body d-flex align-items-center">
            <span class="font-weight-bold">
                #<span th:text="${r.reviewId}"></span>
                <span th:text="${r.submittedFarmName}"></span>
            </span>
            <span class="text-muted ml-2">
                （<span th:text="${r.farmerEmail}"></span>，第 <span th:text="${r.reviewRound}"></span> 輪）
            </span>
            <!-- 認領狀態標示 -->
            <span th:if="${r.adminId == currentAdminId}" class="badge badge-primary ml-2">您負責中</span>
            <span th:if="${r.adminId == null}" class="badge badge-warning ml-2">尚未被認領</span>
            <span th:if="${r.adminId != null and r.adminId != currentAdminId}" class="badge badge-secondary ml-2"
                  th:text="'由 ' + ${r.adminName} + ' 審核中'"></span>
        </summary>

        <div class="card-body pt-2">
            <p class="mb-2 text-muted">送審地址：
                <span th:text="${r.submittedCityName}"></span>
                <span th:text="${r.submittedDistName}"></span>
                <span th:text="${r.submittedFarmAddress}"></span>
            </p>

            <!-- 只有負責（認領）此案件的管理員才能檢視文件並操作 -->
            <div th:if="${r.adminId == currentAdminId}">
                <!-- 證明文件圖片：有上傳才顯示，點擊可放大 -->
                <div class="mb-2">
                    <img th:if="${r.hasCertLand}"     width="160" class="cert-img mr-2"
                         th:src="@{/admin/reviews/{id}/cert/land(id=${r.reviewId})}"/>
                    <img th:if="${r.hasCertProduct}"  width="160" class="cert-img mr-2"
                         th:src="@{/admin/reviews/{id}/cert/product(id=${r.reviewId})}"/>
                    <img th:if="${r.hasCertIdentity}" width="160" class="cert-img mr-2"
                         th:src="@{/admin/reviews/{id}/cert/identity(id=${r.reviewId})}"/>
                </div>

                <!-- 核准：點開可填「內部備註」（選填，僅後台可見、不外洩給小農）後確認 -->
                <details class="d-inline-block reject-box">
                    <summary class="btn btn-success btn-sm">核准</summary>
                    <form method="post" class="form-inline mt-2"
                          th:action="@{/admin/reviews/{id}/approve(id=${r.reviewId})}">
                        <input type="text" name="notes" maxlength="500"
                               class="form-control form-control-sm mr-1"
                               placeholder="內部備註（選填，僅後台可見）"/>
                        <button class="btn btn-success btn-sm">確認核准</button>
                    </form>
                </details>

                <!-- 退件：點開才顯示退件理由（選擇退件後才填理由）-->
                <details class="d-inline-block ml-2 reject-box">
                    <summary class="btn btn-danger btn-sm">退件</summary>
                    <form method="post" class="form-inline mt-2"
                          th:action="@{/admin/reviews/{id}/reject(id=${r.reviewId})}">
                        <input type="text" name="rejectReason" class="form-control form-control-sm mr-1"
                               placeholder="請填寫退件理由" required/>
                        <button class="btn btn-danger btn-sm">確認退件</button>
                    </form>
                </details>
            </div>

            <!-- 尚未被認領：提示先認領 -->
            <p th:if="${r.adminId == null}" class="text-muted mb-0">
                此案件尚未被認領，請先於待審清單認領後才能檢視文件或審核。
            </p>

            <!-- 非認領者：不提供文件與操作 -->
            <p th:if="${r.adminId != null and r.adminId != currentAdminId}" class="text-muted mb-0">
                此案件由其他管理員負責，您無法檢視文件或審核。
            </p>
        </div>
    </details>
    <p th:if="${reviewingData.isEmpty()}" class="text-muted">目前沒有審核中案件</p>

    <!-- ===== 審核歷史（已核准 / 已退件）===== -->
    <!-- 顯示邏輯：證明文件僅負責（認領/審核）此案件的管理員可見；退件理由 / 備註則所有管理員皆可見 -->
    <div class="section-title mt-4"><span class="bar"></span>審核歷史（已核准 APPROVED / 已退件 REJECTED）</div>

    <!-- 複合查詢：農場名 / Email 關鍵字、狀態、審核日期區間 -->
    <form method="get" th:action="@{/admin/reviews}" class="form-inline mb-2">
        <input type="text" name="hKw" th:value="${hKw}" class="form-control form-control-sm mr-2 mb-1"
               placeholder="農場名稱 / Email"/>
        <select name="hStatus" class="form-control form-control-sm mr-2 mb-1">
            <option value="" th:selected="${hStatus == null or hStatus == ''}">全部狀態</option>
            <option value="APPROVED" th:selected="${hStatus == 'APPROVED'}">已核准</option>
            <option value="REJECTED" th:selected="${hStatus == 'REJECTED'}">已退件</option>
        </select>
        <label class="mr-1 mb-1 text-muted">審核日期</label>
        <input type="date" name="hFrom" th:value="${hFrom}" class="form-control form-control-sm mr-1 mb-1" title="起日"/>
        <span class="mr-1 mb-1">~</span>
        <input type="date" name="hTo" th:value="${hTo}" class="form-control form-control-sm mr-2 mb-1" title="迄日"/>
        <button type="submit" class="btn btn-sm btn-primary mr-1 mb-1">查詢</button>
        <a th:href="@{/admin/reviews}" class="btn btn-sm btn-outline-secondary mb-1">清除</a>
    </form>

    <div class="table-card">
        <table class="table table-bordered mb-0">
            <thead class="thead-light">
            <tr>
                <th>審核編號</th><th>農場名稱</th><th>Email</th><th>輪次</th><th>狀態</th>
                <th>審核時間</th><th>審核者</th><th>退件理由</th><th>備註</th><th>證明文件</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${history.content}">
                <td th:text="${r.reviewId}"></td>
                <td th:text="${r.submittedFarmName} ?: ${r.farmName}"></td>
                <td th:text="${r.farmerEmail}"></td>
                <td th:text="${r.reviewRound}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${r.reviewStatus == 'APPROVED'} ? 'badge-success' : 'badge-danger'"
                          th:text="${r.reviewStatus}"></span>
                </td>
                <td th:text="${r.reviewedAt != null ? #temporals.format(r.reviewedAt,'yyyy-MM-dd HH:mm') : '—'}"></td>
                <!-- 審核者 / 退件理由 / 備註：所有管理員皆可見 -->
                <td th:text="${r.adminName} ?: '—'"></td>
                <td th:text="${r.rejectReason} ?: '—'"></td>
                <td th:text="${r.notes} ?: '—'"></td>
                <!-- 證明文件：僅負責此案件的管理員可見（cert 端點後端亦會再擋一次）-->
                <td style="white-space:nowrap;">
                    <th:block th:if="${r.adminId == currentAdminId}">
                        <img th:if="${r.hasCertLand}"     width="56" height="56" class="cert-img mr-1"
                             th:src="@{/admin/reviews/{id}/cert/land(id=${r.reviewId})}"/>
                        <img th:if="${r.hasCertProduct}"  width="56" height="56" class="cert-img mr-1"
                             th:src="@{/admin/reviews/{id}/cert/product(id=${r.reviewId})}"/>
                        <img th:if="${r.hasCertIdentity}" width="56" height="56" class="cert-img"
                             th:src="@{/admin/reviews/{id}/cert/identity(id=${r.reviewId})}"/>
                        <span th:if="${!r.hasCertLand and !r.hasCertProduct and !r.hasCertIdentity}"
                              class="text-muted">—</span>
                    </th:block>
                    <span th:if="${r.adminId != currentAdminId}" class="text-muted">由其他管理員負責</span>
                </td>
            </tr>
            <tr th:if="${history.empty}">
                <td colspan="10" class="text-center text-muted">沒有符合條件的審核歷史</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 分頁列：上一頁 / 下一頁，沿用目前查詢條件 -->
    <div class="d-flex align-items-center mt-2" th:if="${history.totalPages > 0}">
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${history.first} ? 'disabled'"
           th:href="@{/admin/reviews(hKw=${hKw}, hStatus=${hStatus}, hFrom=${hFrom}, hTo=${hTo}, hPage=${history.number - 1})}">上一頁</a>
        <span class="mx-2 text-muted">
            第 <span th:text="${history.number + 1}"></span> / <span th:text="${history.totalPages}"></span> 頁
            （共 <span th:text="${history.totalElements}"></span> 筆）
        </span>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${history.last} ? 'disabled'"
           th:href="@{/admin/reviews(hKw=${hKw}, hStatus=${hStatus}, hFrom=${hFrom}, hTo=${hTo}, hPage=${history.number + 1})}">下一頁</a>
    </div>

</div>
</body>
</html>
