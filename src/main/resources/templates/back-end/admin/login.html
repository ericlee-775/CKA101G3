<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理後台登入｜Farmily</title>
    <th:block th:insert="~{back-end/admin/included-fragment}"></th:block>
    <style>
        .login-wrap {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .login-card { width: 100%; max-width: 400px; }
        .login-brand {
            text-align: center; font-family: var(--font-serif); font-weight: 700;
            color: var(--ink); font-size: 1.6rem; margin-bottom: 4px;
        }
        .login-brand .leaf { font-size: 1.7rem; }
        .login-sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 22px; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand"><span class="leaf">🌿</span> Farmily</div>
        <div class="login-sub">管理後台登入</div>

        <div class="card">
            <div class="card-body p-4">
                <!-- 依網址參數顯示提示；?error / ?logout 由 formLogin 設定 -->
                <div th:if="${param.error}"  class="alert alert-danger">帳號或密碼錯誤，或帳號已被停權</div>
                <div th:if="${param.logout}" class="alert alert-success">您已登出</div>

                <!-- 用 th:action 時，Thymeleaf 會自動幫這個 POST 表單加上 CSRF 隱藏欄位 -->
                <form th:action="@{/admin/login}" method="post">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required autofocus/>
                    </div>
                    <div class="form-group">
                        <label>密碼</label>
                        <input type="password" name="password" class="form-control" required/>
                    </div>
                    <button type="submit" class="btn btn-success btn-block">登入</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
