<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{back-end/admin/layout}">
<head>
    <title>個人資料</title>
</head>
<body>

<h1 class="page-title" layout:fragment="pagetitle">個人資料</h1>

<div layout:fragment="content">
    <div class="card" style="max-width: 560px;">
        <div class="card-header">我的帳號</div>
        <div class="card-body">

            <!-- 走 Thymeleaf 表單提交，th:action 會自動帶 CSRF；成功訊息由 layout 的 toast 顯示 -->
            <form method="post" th:action="@{/admin/profile}">
                <div class="form-group">
                    <label>Email（不可修改）</label>
                    <input type="email" class="form-control" th:value="${profile.adminEmail}" disabled/>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" name="name" class="form-control" maxlength="50" required
                           th:value="${profile.adminName}"/>
                </div>
                <div class="form-group">
                    <label>帳號狀態</label>
                    <div>
                        <span class="badge-status"
                              th:classappend="${profile.adminStatus == 'ACTIVE'} ? 'st-active' : 'st-suspended'"
                              th:text="${profile.adminStatus == 'ACTIVE'} ? '正常'
                                     : (${profile.adminStatus == 'SUSPENDED'} ? '停權' : ${profile.adminStatus})"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label>擁有權限</label>
                    <div class="text-muted"
                         th:text="${profile.permissionCodes != null and !profile.permissionCodes.isEmpty()}
                                ? ${#strings.listJoin(profile.permissionCodes, '、')} : '（無）'">—</div>
                </div>
                <button type="submit" class="btn btn-success">儲存變更</button>
            </form>

        </div>
    </div>
</div>
</body>
</html>
