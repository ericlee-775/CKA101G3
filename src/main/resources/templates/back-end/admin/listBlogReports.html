<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{back-end/admin/layout}">
<head>
    <title>部落格檢舉審核</title>
    <style>
        /* 內容預覽：單行截斷，避免撐開表格 */
        .content-preview { display:inline-block; max-width:320px; vertical-align:middle;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#555; }
        /* ===== 極簡自製 Modal（layout 只有 Bootstrap CSS、沒有 JS，故不用 BS modal）===== */
        .cm-overlay { display:none; position:fixed; inset:0; z-index:1050;
            background:rgba(0,0,0,.5); align-items:center; justify-content:center; padding:20px; }
        .cm-overlay.is-open { display:flex; }
        .cm-dialog { background:#fff; border-radius:8px; width:100%; max-width:680px;
            max-height:80vh; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.3); }
        .cm-head { display:flex; align-items:center; justify-content:space-between;
            padding:14px 18px; border-bottom:1px solid #eee; }
        .cm-head h5 { margin:0; font-size:1.05rem; }
        .cm-close { border:0; background:transparent; font-size:1.4rem; line-height:1; cursor:pointer; color:#888; }
        .cm-body { padding:18px; overflow:auto; white-space:pre-wrap; word-break:break-word; color:#333; }
    </style>
</head>
<body>

<h1 class="page-title" layout:fragment="pagetitle">部落格檢舉審核</h1>

<div layout:fragment="content">

    <!-- 統計摘要 -->
    <div class="table-card mb-4" th:if="${summary != null}">
        <span class="mr-4">待審核　<strong th:text="${summary['pending'] ?: 0}">0</strong></span>
        <span class="mr-4">維持顯示　<strong th:text="${summary['approvedVisible'] ?: 0}">0</strong></span>
        <span class="mr-4">已隱藏　<strong th:text="${summary['rejectedHidden'] ?: 0}">0</strong></span>
    </div>

    <!-- ============ 文章檢舉 ============ -->
    <div class="table-card mb-4">
        <h5 class="mb-3">文章檢舉 · 待審核</h5>
        <table class="table table-striped table-bordered" style="width:100%">
            <thead class="thead-light">
            <tr><th>檢舉編號</th><th>文章標題</th><th>內容</th><th>檢舉原因</th><th>檢舉時間</th><th>操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${pendingBlogReports}">
                <td th:text="${r.reportId}"></td>
                <td>
                    <a th:href="@{/farmily-web/blogs/{id}(id=${r.blogId})}" target="_blank"
                       th:text="${r.blogTitle ?: '（文章已不存在）'}"></a>
                    <small class="text-muted" th:text="'#' + ${r.blogId}"></small>
                </td>
                <td>
                    <span class="content-preview"
                          th:text="${r.blogContent != null ? #strings.abbreviate(r.blogContent, 40) : '—'}"></span>
                    <button type="button" class="btn btn-outline-secondary btn-sm ml-1 js-view"
                            th:if="${r.blogContent != null}"
                            th:attr="data-title=${r.blogTitle},data-body=${r.blogContent}">查看</button>
                </td>
                <td th:text="${r.reportReason}"></td>
                <td th:text="${r.reportTime != null ? #dates.format(r.reportTime,'yyyy-MM-dd HH:mm') : '—'}"></td>
                <td>
                    <form method="post" class="d-inline"
                          th:action="@{/admin/blog-reports/{id}/approve(id=${r.reportId})}">
                        <button class="btn btn-success btn-sm">通過（維持顯示）</button>
                    </form>
                    <form method="post" class="d-inline ml-1"
                          th:action="@{/admin/blog-reports/{id}/reject(id=${r.reportId})}">
                        <button class="btn btn-danger btn-sm">駁回（隱藏文章）</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pendingBlogReports == null or pendingBlogReports.isEmpty()}">
                <td colspan="6" class="text-center text-muted">沒有待審核的文章檢舉</td>
            </tr>
            </tbody>
        </table>

        <h6 class="mt-4 text-muted">已處理（歷史）</h6>
        <table class="table table-bordered table-sm" style="width:100%">
            <thead class="thead-light">
            <tr><th>檢舉編號</th><th>文章標題</th><th>內容</th><th>檢舉原因</th><th>結果</th><th>檢舉時間</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${historyBlogReports}">
                <td th:text="${r.reportId}"></td>
                <td>
                    <a th:href="@{/farmily-web/blogs/{id}(id=${r.blogId})}" target="_blank"
                       th:text="${r.blogTitle ?: '（文章已不存在）'}"></a>
                    <small class="text-muted" th:text="'#' + ${r.blogId}"></small>
                </td>
                <td>
                    <span class="content-preview"
                          th:text="${r.blogContent != null ? #strings.abbreviate(r.blogContent, 40) : '—'}"></span>
                    <button type="button" class="btn btn-outline-secondary btn-sm ml-1 js-view"
                            th:if="${r.blogContent != null}"
                            th:attr="data-title=${r.blogTitle},data-body=${r.blogContent}">查看</button>
                </td>
                <td th:text="${r.reportReason}"></td>
                <td>
                    <span class="badge-status"
                          th:classappend="${r.reportStatus.name() == 'APPROVED_VISIBLE'} ? 'st-active' : 'st-suspended'"
                          th:text="${r.reportStatus.name() == 'APPROVED_VISIBLE'} ? '通過（顯示）' : '駁回（已隱藏）'"></span>
                </td>
                <td th:text="${r.reportTime != null ? #dates.format(r.reportTime,'yyyy-MM-dd HH:mm') : '—'}"></td>
            </tr>
            <tr th:if="${historyBlogReports == null or historyBlogReports.isEmpty()}">
                <td colspan="6" class="text-center text-muted">尚無處理紀錄</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- ============ 留言檢舉 ============ -->
    <div class="table-card">
        <h5 class="mb-3">留言檢舉 · 待審核</h5>
        <table class="table table-striped table-bordered" style="width:100%">
            <thead class="thead-light">
            <tr><th>檢舉編號</th><th>留言內容</th><th>所屬文章</th><th>檢舉原因</th><th>檢舉時間</th><th>操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${pendingCommentReports}">
                <td th:text="${r.reportId}"></td>
                <td>
                    <span class="content-preview"
                          th:text="${r.commentContent != null ? #strings.abbreviate(r.commentContent, 40) : '（留言已不存在）'}"></span>
                    <button type="button" class="btn btn-outline-secondary btn-sm ml-1 js-view"
                            th:if="${r.commentContent != null}"
                            th:attr="data-title='留言 #' + ${r.commentId},data-body=${r.commentContent}">查看</button>
                </td>
                <td>
                    <a th:href="@{/farmily-web/blogs/{id}(id=${r.blogId})}" target="_blank"
                       th:text="${r.blogTitle ?: '（文章已不存在）'}"></a>
                    <small class="text-muted" th:text="'#' + ${r.blogId}"></small>
                </td>
                <td th:text="${r.reportReason}"></td>
                <td th:text="${r.reportTime != null ? #dates.format(r.reportTime,'yyyy-MM-dd HH:mm') : '—'}"></td>
                <td>
                    <form method="post" class="d-inline"
                          th:action="@{/admin/comment-reports/{id}/approve(id=${r.reportId})}">
                        <button class="btn btn-success btn-sm">通過</button>
                    </form>
                    <form method="post" class="d-inline ml-1"
                          th:action="@{/admin/comment-reports/{id}/reject(id=${r.reportId})}">
                        <button class="btn btn-danger btn-sm">駁回</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pendingCommentReports == null or pendingCommentReports.isEmpty()}">
                <td colspan="6" class="text-center text-muted">沒有待審核的留言檢舉</td>
            </tr>
            </tbody>
        </table>

        <h6 class="mt-4 text-muted">已處理（歷史）</h6>
        <table class="table table-bordered table-sm" style="width:100%">
            <thead class="thead-light">
            <tr><th>檢舉編號</th><th>留言內容</th><th>所屬文章</th><th>檢舉原因</th><th>結果</th><th>檢舉時間</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${historyCommentReports}">
                <td th:text="${r.reportId}"></td>
                <td>
                    <span class="content-preview"
                          th:text="${r.commentContent != null ? #strings.abbreviate(r.commentContent, 40) : '（留言已不存在）'}"></span>
                    <button type="button" class="btn btn-outline-secondary btn-sm ml-1 js-view"
                            th:if="${r.commentContent != null}"
                            th:attr="data-title='留言 #' + ${r.commentId},data-body=${r.commentContent}">查看</button>
                </td>
                <td>
                    <a th:href="@{/farmily-web/blogs/{id}(id=${r.blogId})}" target="_blank"
                       th:text="${r.blogTitle ?: '（文章已不存在）'}"></a>
                    <small class="text-muted" th:text="'#' + ${r.blogId}"></small>
                </td>
                <td th:text="${r.reportReason}"></td>
                <td>
                    <span class="badge-status"
                          th:classappend="${r.reportStatus.name() == 'APPROVED_VISIBLE'} ? 'st-active' : 'st-suspended'"
                          th:text="${r.reportStatus.name() == 'APPROVED_VISIBLE'} ? '通過' : '駁回（已隱藏）'"></span>
                </td>
                <td th:text="${r.reportTime != null ? #dates.format(r.reportTime,'yyyy-MM-dd HH:mm') : '—'}"></td>
            </tr>
            <tr th:if="${historyCommentReports == null or historyCommentReports.isEmpty()}">
                <td colspan="6" class="text-center text-muted">尚無處理紀錄</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 內容檢視 Modal（單一個，重複使用） -->
    <div class="cm-overlay" id="contentModal">
        <div class="cm-dialog">
            <div class="cm-head">
                <h5 id="cmTitle">內容</h5>
                <button type="button" class="cm-close" aria-label="關閉">×</button>
            </div>
            <div class="cm-body" id="cmBody"></div>
        </div>
    </div>

</div>

<th:block layout:fragment="extrascript">
    <script>
        (function () {
            var modal = document.getElementById('contentModal');
            var cmTitle = document.getElementById('cmTitle');
            var cmBody = document.getElementById('cmBody');

            // 每個「查看」按鈕：把 data-title / data-body 塞進 modal 再開啟
            // 用 textContent（非 innerHTML），文章即使含 HTML 也只當純文字顯示，避免 XSS
            document.querySelectorAll('.js-view').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    cmTitle.textContent = btn.getAttribute('data-title') || '內容';
                    cmBody.textContent = btn.getAttribute('data-body') || '（無內容）';
                    modal.classList.add('is-open');
                });
            });

            // 點遮罩或關閉鈕就關閉
            modal.addEventListener('click', function (e) {
                if (e.target === modal || e.target.classList.contains('cm-close')) {
                    modal.classList.remove('is-open');
                }
            });
            // Esc 關閉
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') modal.classList.remove('is-open');
            });
        })();
    </script>
</th:block>

</body>
</html>
