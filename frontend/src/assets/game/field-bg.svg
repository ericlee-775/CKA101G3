<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">
  <!-- 天空漸層 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee3f5"/>
      <stop offset="70%" stop-color="#e8f7ee"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cba76"/>
      <stop offset="100%" stop-color="#5fa25e"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94cc84"/>
      <stop offset="100%" stop-color="#6fb069"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>
  <!-- 太陽光暈 -->
  <circle cx="1010" cy="80" r="70" fill="#ffe9a8" opacity="0.5"/>
  <circle cx="1010" cy="80" r="42" fill="#ffd75e"/>
  <!-- 雲朵 -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="220" cy="80" rx="70" ry="24"/>
    <ellipse cx="270" cy="66" rx="48" ry="20"/>
    <ellipse cx="620" cy="120" rx="60" ry="20"/>
    <ellipse cx="660" cy="108" rx="40" ry="16"/>
  </g>
  <!-- 遠山 -->
  <path d="M0 260 Q200 150 420 250 T900 240 T1200 250 V400 H0 Z" fill="url(#hillB)"/>
  <!-- 近丘 -->
  <path d="M0 320 Q300 240 620 320 T1200 310 V400 H0 Z" fill="url(#hillA)"/>
  <!-- 小樹 -->
  <g>
    <rect x="140" y="270" width="10" height="26" rx="3" fill="#8a5a34"/>
    <circle cx="145" cy="258" r="26" fill="#3f8f4e"/>
    <circle cx="128" cy="270" r="18" fill="#48a057"/>
    <rect x="1040" y="280" width="9" height="24" rx="3" fill="#8a5a34"/>
    <circle cx="1044" cy="268" r="22" fill="#3f8f4e"/>
  </g>
  <!-- 柵欄 -->
  <g fill="#c99a62">
    <rect x="740" y="300" width="8" height="40" rx="2"/>
    <rect x="780" y="300" width="8" height="40" rx="2"/>
    <rect x="820" y="300" width="8" height="40" rx="2"/>
    <rect x="732" y="308" width="104" height="7" rx="3"/>
    <rect x="732" y="324" width="104" height="7" rx="3"/>
  </g>
</svg>
