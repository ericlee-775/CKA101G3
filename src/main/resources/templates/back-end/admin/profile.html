<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{back-end/admin/layout}">
<head>
    <title>個人資料</title>
</head>
<body>

<h1 class="page-title" layout:fragment="pagetitle">個人資料</h1>

<div layout:fragment="content">
    <div class="card" style="max-width: 560px;">
        <div class="card-header">我的帳號</div>
        <div class="card-body">

            <!-- 走 Thymeleaf 表單提交，th:action 會自動帶 CSRF；成功訊息由 layout 的 toast 顯示 -->
            <form method="post" th:action="@{/admin/profile}">
                <div class="form-group">
                    <label>Email（不可修改）</label>
                    <input type="email" class="form-control" th:value="${profile.adminEmail}" disabled/>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" name="name" class="form-control" maxlength="50" required
                           th:value="${profile.adminName}"/>
                </div>
                <div class="form-group">
                    <label>帳號狀態</label>
                    <div>
                        <span class="badge-status"
                              th:classappend="${profile.adminStatus == 'ACTIVE'} ? 'st-active' : 'st-suspended'"
                              th:text="${profile.adminStatus == 'ACTIVE'} ? '正常'
                                     : (${profile.adminStatus == 'SUSPENDED'} ? '停權' : ${profile.adminStatus})"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label>擁有權限</label>
                    <div class="text-muted"
                         th:text="${profile.permissionCodes != null and !profile.permissionCodes.isEmpty()}
                                ? ${#strings.listJoin(profile.permissionCodes, '、')} : '（無）'">—</div>
                </div>
                <button type="submit" class="btn btn-success">儲存變更</button>
            </form>

        </div>
    </div>

    <!-- 變更密碼：獨立表單，成功後系統會寄通知信到本人信箱 -->
    <div class="card mt-4" style="max-width: 560px;">
        <div class="card-header">變更密碼</div>
        <div class="card-body">
            <form method="post" th:action="@{/admin/profile/password}">
                <div class="form-group">
                    <label>目前密碼</label>
                    <div class="input-group">
                        <input type="password" name="oldPassword" class="form-control" required/>
                        <div class="input-group-append">
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd(this)" tabindex="-1" aria-label="顯示密碼">
                                <!-- 眼睛圖示對齊前端 Vue 的 PasswordInput（Feather eye / eye-off）-->
                                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>新密碼（至少 8 碼）</label>
                    <div class="input-group">
                        <input type="password" name="newPassword" class="form-control" required
                               minlength="8" maxlength="60"
                               pattern="(?=.*[A-Za-z])(?=.*\d).{8,60}"
                               title="密碼長度需 8~60 字，且需同時包含英文字母與數字"/>
                        <div class="input-group-append">
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd(this)" tabindex="-1" aria-label="顯示密碼">
                                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">變更密碼</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="extrascript">
    <script>
        // 切換密碼欄顯示/隱藏
        function togglePwd(btn) {
            var input = btn.closest('.input-group').querySelector('input');
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.querySelector('.icon-eye').style.display = show ? 'none' : '';
            btn.querySelector('.icon-eye-off').style.display = show ? '' : 'none';
            btn.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
        }
    </script>
</th:block>
</body>
</html>
