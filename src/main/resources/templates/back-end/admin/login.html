<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理後台登入｜Farmily</title>
    <th:block th:insert="~{back-end/admin/included-fragment}"></th:block>
    <style>
        .login-wrap {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .login-card { width: 100%; max-width: 400px; }
        .login-brand {
            text-align: center; font-family: var(--font-serif); font-weight: 700;
            color: var(--ink); font-size: 1.6rem; margin-bottom: 4px;
        }
        .login-brand .leaf { font-size: 1.7rem; }
        .login-sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 22px; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand"><span class="leaf">🌿</span> Farmily</div>
        <div class="login-sub">管理後台登入</div>

        <div class="card">
            <div class="card-body p-4">
                <!-- 依網址參數顯示提示；?error / ?logout 由 formLogin 設定 -->
                <div th:if="${param.error}"  class="alert alert-danger">帳號或密碼錯誤，或帳號已被停權</div>
                <div th:if="${param.logout}" class="alert alert-success">您已登出</div>

                <!-- 用 th:action 時，Thymeleaf 會自動幫這個 POST 表單加上 CSRF 隱藏欄位 -->
                <form th:action="@{/admin/login}" method="post">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required autofocus/>
                    </div>
                    <div class="form-group">
                        <label>密碼</label>
                        <div class="input-group">
                            <input type="password" name="password" class="form-control" required/>
                            <div class="input-group-append">
                                <button type="button" class="btn btn-outline-secondary" onclick="togglePwd(this)" tabindex="-1" aria-label="顯示密碼">
                                    <!-- 眼睛圖示對齊前端 Vue 的 PasswordInput（Feather eye / eye-off）-->
                                    <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success btn-block">登入</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    // 切換密碼欄顯示/隱藏
    function togglePwd(btn) {
        var input = btn.closest('.input-group').querySelector('input');
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.querySelector('.icon-eye').style.display = show ? 'none' : '';
        btn.querySelector('.icon-eye-off').style.display = show ? '' : 'none';
        btn.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
    }
</script>
</body>
</html>
