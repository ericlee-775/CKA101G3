<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{back-end/admin/layout}">
<head>
    <title>小農管理</title>
    <!-- 直接放在 <head>，由 layout-dialect 自動合併，不可再包 layout:fragment 否則會重複載入 -->
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap4.min.css"/>
    <script>
        $(document).ready(function () {
            $('#farmerTable').DataTable({
                "lengthMenu": [10, 20, 50, 100],
                "language": {
                    "search": "搜尋:", "lengthMenu": "顯示 _MENU_ 筆",
                    "info": "第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆", "zeroRecords": "沒有符合的資料",
                    "paginate": { "first": "第一頁", "previous": "上一頁", "next": "下一頁", "last": "最後一頁" }
                }
            });
        });
    </script>
</head>
<body>

<h1 class="page-title" layout:fragment="pagetitle">小農管理</h1>

<div layout:fragment="content">
    <div class="table-card">
        <table id="farmerTable" class="table table-striped table-bordered" style="width:100%">
            <thead class="thead-light">
            <tr>
                <th>編號</th><th>Email</th><th>農場名稱</th><th>電話</th>
                <th>縣市</th><th>區</th><th>小農狀態</th><th>審核狀態</th><th>操作</th><th>詳情</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="farmer : ${farmerListData}">
                <td th:text="${farmer.farmerId}"></td>
                <td th:text="${farmer.email}"></td>
                <td th:text="${farmer.farmName}"></td>
                <td th:text="${farmer.farmerPhoneNum}"></td>
                <td th:text="${farmer.cityName}"></td>
                <td th:text="${farmer.distName}"></td>
                <td>
                    <span class="badge-status"
                          th:classappend="${farmer.farmerStatus == 'ACTIVE'} ? 'st-active'
                                        : (${farmer.farmerStatus == 'PENDING'} ? 'st-pending' : 'st-suspended')"
                          th:text="${farmer.farmerStatus}"></span>
                </td>
                <td th:text="${farmer.reviewStatus}"></td>
                <td>
                    <!-- ACTIVE 才能停權 -->
                    <form th:if="${farmer.farmerStatus == 'ACTIVE'}" method="post" class="d-inline"
                          th:action="@{/admin/farmers/{id}/suspend(id=${farmer.farmerId})}">
                        <button class="btn btn-sm btn-outline-danger">停權</button>
                    </form>
                    <!-- SUSPENDED 才能恢復 -->
                    <form th:if="${farmer.farmerStatus == 'SUSPENDED'}" method="post" class="d-inline"
                          th:action="@{/admin/farmers/{id}/reinstate(id=${farmer.farmerId})}">
                        <button class="btn btn-sm btn-outline-success">恢復</button>
                    </form>
                    <span th:if="${farmer.farmerStatus == 'PENDING'}" class="text-muted">尚未啟用</span>
                </td>
                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/admin/farmers/{id}(id=${farmer.farmerId})}">詳情</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
