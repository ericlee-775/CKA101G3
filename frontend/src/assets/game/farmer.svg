<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
  <!-- 草帽小農夫角色 -->
  <!-- 身體（吊帶褲） -->
  <rect x="40" y="72" width="40" height="44" rx="10" fill="#4c7dbf"/>
  <rect x="46" y="66" width="8" height="14" rx="3" fill="#4c7dbf"/>
  <rect x="66" y="66" width="8" height="14" rx="3" fill="#4c7dbf"/>
  <!-- 衣袖 -->
  <rect x="28" y="72" width="14" height="30" rx="7" fill="#e8944a"/>
  <rect x="78" y="72" width="14" height="30" rx="7" fill="#e8944a"/>
  <!-- 手 -->
  <circle cx="35" cy="106" r="7" fill="#f7c99b"/>
  <circle cx="85" cy="106" r="7" fill="#f7c99b"/>
  <!-- 腳 -->
  <rect x="46" y="114" width="11" height="18" rx="5" fill="#7a5230"/>
  <rect x="63" y="114" width="11" height="18" rx="5" fill="#7a5230"/>
  <!-- 頭 -->
  <circle cx="60" cy="46" r="24" fill="#f7c99b"/>
  <!-- 腮紅 -->
  <circle cx="46" cy="54" r="4.5" fill="#f5a08c" opacity="0.7"/>
  <circle cx="74" cy="54" r="4.5" fill="#f5a08c" opacity="0.7"/>
  <!-- 眼睛與微笑 -->
  <circle cx="51" cy="46" r="3" fill="#3a2c20"/>
  <circle cx="69" cy="46" r="3" fill="#3a2c20"/>
  <path d="M52 57 Q60 64 68 57" stroke="#3a2c20" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 草帽 -->
  <ellipse cx="60" cy="30" rx="36" ry="10" fill="#e3b957"/>
  <path d="M38 30 Q38 8 60 8 Q82 8 82 30 Z" fill="#f0ca6a"/>
  <rect x="38" y="24" width="44" height="6" rx="3" fill="#c9973d"/>
  <!-- 手上的小鏟子 -->
  <rect x="88" y="76" width="5" height="30" rx="2" fill="#9a6b3f" transform="rotate(18 90 90)"/>
  <path d="M97 108 l10 4 -4 10 -10 -4 Z" fill="#b8bec4" transform="rotate(18 100 114)"/>
</svg>
