spring.mail.password=jbwa pmwc iwbv knfz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 信件連結用的網址前綴（SPA 部署在 /farmily-web/ 子路徑下，見 WebConfig，缺這段會 500）
app.frontend-base-url=http://localhost:8080/farmily-web

# Redis - Email 驗證 token 有效時間 (分鐘) = 24 小時
app.token.email-verify-ttl-min=1440

# Redis - 重設密碼 token 有效時間 (分鐘) = 30 分鐘
app.token.password-reset-ttl-min=30

# Cookie 端：預設「不」設 Max-Age，讓 JSESSIONID 維持 session cookie（關瀏覽器即刪）。
# 只有勾「記住我」時，才由 SessionCookieSupport 補寫帶 Max-Age 的持久化 cookie 覆蓋它。
#server.servlet.session.cookie.max-age=1d

# Server 端 session 閒置過期的「預設值」；登入時會依「記住我」用 setMaxInactiveInterval
# 覆蓋（勾=14 天、不勾=30 分）。此預設值供未覆蓋者（如 OAuth 登入）使用。
server.servlet.session.timeout=30m

# 處理 cors 跨域同源問題
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
