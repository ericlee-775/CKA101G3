<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{back-end/admin/layout}">
<head>
    <title>總覽</title>
</head>
<body>

<h1 class="page-title" layout:fragment="pagetitle">總覽</h1>

<div layout:fragment="content">

    <div class="card mb-4">
        <div class="card-body">
            <h4 class="mb-1">歡迎回來，<span th:text="${adminName}">管理員</span> 👋</h4>
            <p class="text-muted mb-0">這裡是 Farmily 管理後台，請由下方或左側選單進入各管理模組。</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 col-lg-4 mb-4" sec:authorize="hasAuthority('PERM_MEMBER')">
            <a class="card stat-card h-100" th:href="@{/admin/members}">
                <span class="stat-ico">👥</span>
                <span>
                    <span class="stat-label d-block">會員資料管理 | 權限操作</span>
                    <span class="stat-link">會員管理 →</span>
                </span>
            </a>
        </div>

        <div class="col-md-6 col-lg-4 mb-4" sec:authorize="hasAuthority('PERM_FARMER')">
            <a class="card stat-card h-100" th:href="@{/admin/farmers}">
                <span class="stat-ico">🧑‍🌾</span>
                <span>
                    <span class="stat-label d-block">小農資料管理 | 權限操作</span>
                    <span class="stat-link">小農管理 →</span>
                </span>
            </a>
        </div>

        <div class="col-md-6 col-lg-4 mb-4" sec:authorize="hasAuthority('PERM_FARMER')">
            <a class="card stat-card h-100" th:href="@{/admin/reviews}">
                <span class="stat-ico">📋</span>
                <span>
                    <span class="stat-label d-block">小農申請 | 案件審核</span>
                    <span class="stat-link">小農申請審核 →</span>
                </span>
            </a>
        </div>

        <div class="col-md-6 col-lg-4 mb-4" sec:authorize="hasAuthority('PERM_SHOP')">
            <a class="card stat-card h-100" th:href="@{/admin/coupons}">
                <span class="stat-ico">🎟️</span>
                <span>
                    <span class="stat-label d-block">優惠券管理 | 寄信發券</span>
                    <span class="stat-link">優惠券管理 →</span>
                </span>
            </a>
        </div>

        <!-- 活動審核（體驗活動）-->
        <div class="col-md-6 col-lg-4 mb-4" sec:authorize="hasAuthority('PERM_EVENT')">
            <a class="card stat-card h-100" th:href="@{/admin/farm-trips}">
                <span class="stat-ico">🎪</span>
                <span>
                    <span class="stat-label d-block">體驗預約 | 活動管理</span>
                    <span class="stat-link">活動審核 →</span>
                </span>
            </a>
        </div>

        <div class="col-md-6 col-lg-4 mb-4" sec:authorize="hasAuthority('PERM_NEWS')">
            <a class="card stat-card h-100" th:href="@{/admin/news}">
                <span class="stat-ico">📰</span>
                <span>
                    <span class="stat-label d-block">消息管理 | 發佈通知</span>
                    <span class="stat-link">最新消息管理 →</span>
                </span>
            </a>
        </div>

        <div class="col-md-6 col-lg-4 mb-4" sec:authorize="hasAuthority('PERM_BLOG')">
            <a class="card stat-card h-100" th:href="@{/admin/blog-reports}">
                <span class="stat-ico">📝</span>
                <span>
                    <span class="stat-label d-block">文章檢舉 | 留言審核</span>
                    <span class="stat-link">檢舉審核 →</span>
                </span>
            </a>
        </div>

        <div class="col-md-6 col-lg-4 mb-4" sec:authorize="hasAnyAuthority('PERM_ADMIN','PERM_SHOP')">
            <a class="card stat-card h-100" th:href="@{/admin/products}">
                <span class="stat-ico">📰</span>
                <span>
                    <span class="stat-label d-block">熱們商品管理 | </span>
                    <span class="stat-link">熱門商品 →</span>
                </span>
            </a>
        </div>

        <div class="col-md-6 col-lg-4 mb-4" sec:authorize="hasAuthority('PERM_ADMIN')">
            <a class="card stat-card h-100" th:href="@{/admin/admins}">
                <span class="stat-ico">🛡️</span>
                <span>
                    <span class="stat-label d-block">管理員管理 | 權限控管</span>
                    <span class="stat-link">管理員管理 →</span>
                </span>
            </a>
        </div>
    </div>

</div>
</body>
</html>
