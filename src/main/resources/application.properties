# 信件連結用的網址前綴 (點驗證連結會打回後端)
app.frontend-base-url=http://localhost:8080

# Redis - Email 驗證 token 有效時間 (分鐘) = 24 小時
app.token.email-verify-ttl-min=1440

# Redis - 重設密碼 token 有效時間 (分鐘) = 30 分鐘
app.token.password-reset-ttl-min=30


# Cookie 端：給 JSESSIONID 加上 Max-Age，關瀏覽器後不會被刪
server.servlet.session.cookie.max-age=1d

# Server 端：session 閒置多久才過期（要 >= cookie max-age 才有意義）
server.servlet.session.timeout=1d

# 處理 cors 跨域同源問題
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax